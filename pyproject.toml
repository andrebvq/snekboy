[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snekboy"
version = "0.8.0"
description = "Game Boy (DMG) emulator written in Python"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Andre"}
]
keywords = ["gameboy", "emulator", "dmg", "retro", "gaming"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Emulators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "pygame>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Repository = "https://github.com/andrebvq/snekboy"

# Entry point uses __main__ block in emulator.py
# Run with: python -m src.emulator

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "tools*", "docs*"]

[tool.setuptools.package-data]
src = ["**/*.py"]