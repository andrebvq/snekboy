[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snekboy"
version = "0.1.0"
description = "A Game Boy emulator in Python"
requires-python = ">=3.8"
dependencies = [
    "pygame>=2.0.0",
    "numpy>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["**/*"]